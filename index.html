    <form action="#"> 
        <p>1. ¿Cuál es tu nombre?</p> 
        <input type="text" id="nombre"/>

        <input type="text" id="nombre del juego"> 

        <p>3. ¿Qué actividad te gusta realizar en tu tiempo libre?</p> 
        <input type="text" id="recomendacion del juego"> 

        <p>4. ¿Te gustaría aprender una nueva habilidad?</p> 
        <select id="recomendaria"> 
            <option value="">Selecciona</option> 
            <option value="Sí">Sí</option> 
            <option value="No">No</option> 
            <option value="Tal vez">Tal vez</option> 
        </select> 

        <br><br> 
        <button id="boton">Enviar</button> 
    </form> 

    <h2 id="respuesta"></h2>
